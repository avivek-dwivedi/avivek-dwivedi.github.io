<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="420" height="640" role="img" aria-labelledby="rlTitle rlDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="rlTitle">LLM request lifecycle</title>
  <desc id="rlDesc">A prompt flows through tokenizer, input tokens, prefill, KV cache, decode step, sampling, generated token and streaming. The decode step loops back through KV cache to represent repeated token generation.</desc>

  <style>
    .box { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 6; ry: 6; }
    .box-accent { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1; rx: 6; ry: 6; }
    .box-loop { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; rx: 6; ry: 6; }
    .t  { font-size: 13px; fill: #1f2328; text-anchor: middle; }
    .ta { font-size: 13px; fill: #0a66c2; text-anchor: middle; font-weight: 600; }
    .tl { font-size: 13px; fill: #9a6700; text-anchor: middle; font-weight: 600; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.06em; text-transform: uppercase; }
    .edge { stroke: #59636e; stroke-width: 1.3; fill: none; }
    .loop-edge { stroke: #d4a72c; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; }
  </style>

  <rect class="box" x="140" y="20" width="140" height="40"/>
  <text class="t" x="210" y="45">Prompt</text>

  <line class="edge" x1="210" y1="60" x2="210" y2="84"/>
  <polygon class="edge" points="206,80 210,88 214,80" fill="#59636e"/>

  <rect class="box" x="140" y="90" width="140" height="40"/>
  <text class="t" x="210" y="115">Tokenizer</text>

  <line class="edge" x1="210" y1="130" x2="210" y2="154"/>
  <polygon class="edge" points="206,150 210,158 214,150" fill="#59636e"/>

  <rect class="box" x="140" y="160" width="140" height="40"/>
  <text class="t" x="210" y="185">Input Tokens</text>

  <line class="edge" x1="210" y1="200" x2="210" y2="224"/>
  <polygon class="edge" points="206,220 210,228 214,220" fill="#59636e"/>

  <rect class="box-accent" x="140" y="230" width="140" height="44"/>
  <text class="ta" x="210" y="257">Prefill</text>

  <line class="edge" x1="210" y1="274" x2="210" y2="298"/>
  <polygon class="edge" points="206,294 210,302 214,294" fill="#59636e"/>

  <rect class="box" x="140" y="304" width="140" height="44"/>
  <text class="t" x="210" y="331">KV Cache</text>

  <line class="edge" x1="210" y1="348" x2="210" y2="372"/>
  <polygon class="edge" points="206,368 210,376 214,368" fill="#59636e"/>

  <rect class="box-loop" x="140" y="378" width="140" height="44"/>
  <text class="tl" x="210" y="405">Decode Step</text>

  <line class="edge" x1="210" y1="422" x2="210" y2="446"/>
  <polygon class="edge" points="206,442 210,450 214,442" fill="#59636e"/>

  <rect class="box" x="140" y="452" width="140" height="40"/>
  <text class="t" x="210" y="477">Sampling</text>

  <line class="edge" x1="210" y1="492" x2="210" y2="516"/>
  <polygon class="edge" points="206,512 210,520 214,512" fill="#59636e"/>

  <rect class="box" x="140" y="522" width="140" height="40"/>
  <text class="t" x="210" y="547">Generated Token</text>

  <line class="edge" x1="210" y1="562" x2="210" y2="586"/>
  <polygon class="edge" points="206,582 210,590 214,582" fill="#59636e"/>

  <rect class="box" x="140" y="592" width="140" height="40"/>
  <text class="t" x="210" y="617">Streaming</text>

  <!-- Loop back: Decode Step -> KV Cache -->
  <path class="loop-edge" d="M140,400 C60,400 60,326 140,326"/>
  <polygon class="loop-edge" points="144,322 136,326 144,330" fill="#d4a72c" stroke="#d4a72c"/>
  <text class="lbl" x="78" y="365">repeats</text>

  <text class="lbl" x="290" y="252">prefill</text>
  <text class="lbl" x="290" y="400">decode</text>
</svg>