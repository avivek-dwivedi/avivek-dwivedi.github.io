<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="ctTitle ctDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ctTitle">Cache types and their system layers</title>
  <desc id="ctDesc">Four cache types at different layers. KV cache is active sequence state at the inference engine layer. Prefix cache is repeated exact or shared prefix reuse at the inference layer. Provider prompt cache is provider-controlled prefix reuse at the API or provider layer. Semantic cache is meaning-based response reuse at the application layer.</desc>

  <style>
    .box { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 6; ry: 6; }
    .b1 { fill: #ddf4ff; stroke: #2f81f7; }
    .b2 { fill: #fff8c5; stroke: #d4a72c; }
    .b3 { fill: #dafbe1; stroke: #2da44e; }
    .b4 { fill: #f6f8fa; stroke: #8957e5; }
    .t { font-size: 13px; fill: #1f2328; text-anchor: middle; font-weight: 600; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.04em; }
    .layer { font-size: 10px; fill: #6e7781; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.08em; }
    .edge { stroke: #59636e; stroke-width: 1.2; fill: none; }
  </style>

  <rect class="box b1" x="20"  y="40" width="170" height="120"/>
  <text class="t" x="105" y="70">KV CACHE</text>
  <text class="lbl" x="105" y="95">Active sequence state</text>
  <text class="lbl" x="105" y="120">attention K/V tensors</text>
  <text class="layer" x="105" y="150">inference engine</text>

  <rect class="box b2" x="205" y="40" width="170" height="120"/>
  <text class="t" x="290" y="70">PREFIX CACHE</text>
  <text class="lbl" x="290" y="95">Repeated exact /</text>
  <text class="lbl" x="290" y="112">shared prefix reuse</text>
  <text class="layer" x="290" y="150">inference layer</text>

  <rect class="box b3" x="390" y="40" width="170" height="120"/>
  <text class="t" x="475" y="70">PROVIDER PROMPT CACHE</text>
  <text class="lbl" x="475" y="100">Provider-controlled</text>
  <text class="lbl" x="475" y="117">prefix reuse</text>
  <text class="layer" x="475" y="150">API / provider layer</text>

  <rect class="box b4" x="575" y="40" width="170" height="120"/>
  <text class="t" x="660" y="70">SEMANTIC CACHE</text>
  <text class="lbl" x="660" y="100">Meaning-based</text>
  <text class="lbl" x="660" y="117">response reuse</text>
  <text class="layer" x="660" y="150">application layer</text>

  <line class="edge" x1="190" y1="100" x2="205" y2="100"/>
  <line class="edge" x1="375" y1="100" x2="390" y2="100"/>
  <line class="edge" x1="560" y1="100" x2="575" y2="100"/>

  <text class="lbl" x="380" y="220">different mechanisms · different layers · do not conflate</text>
  <text class="lbl" x="380" y="245">KV cache ≠ prefix cache ≠ provider prompt cache ≠ semantic cache</text>

  <text class="layer" x="380" y="300">lower layers serve upper layers</text>
  <line class="edge" x1="160" y1="280" x2="640" y2="280"/>
  <polygon class="edge" points="636,276 644,280 636,284" fill="#59636e"/>
</svg>