<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="scTitle scDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="scTitle">Inference scheduler</title>
  <desc id="scDesc">Incoming requests enter a queue. The scheduler decides which requests run prefill work, which run decode work, while remaining aware of memory capacity and batch or token budgets. Selected work is dispatched to the GPU.</desc>

  <style>
    .box { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 6; ry: 6; }
    .qbox { fill: #f6f8fa; stroke: #30363d; stroke-width: 1; rx: 6; ry: 6; }
    .sbox { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1; rx: 6; ry: 6; }
    .gbox { fill: #dafbe1; stroke: #2da44e; stroke-width: 1; rx: 6; ry: 6; }
    .cap { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; rx: 4; ry: 4; }
    .t { font-size: 13px; fill: #1f2328; text-anchor: middle; }
    .ta { font-size: 13px; fill: #0a66c2; text-anchor: middle; font-weight: 600; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.06em; }
    .edge { stroke: #59636e; stroke-width: 1.3; fill: none; }
  </style>

  <rect class="qbox" x="300" y="20" width="160" height="40"/>
  <text class="t" x="380" y="45">Incoming requests</text>
  <line class="edge" x1="380" y1="62" x2="380" y2="84"/>
  <polygon class="edge" points="376,80 380,88 384,80" fill="#59636e"/>

  <rect class="qbox" x="300" y="90" width="160" height="40"/>
  <text class="t" x="380" y="115">Queue</text>
  <line class="edge" x1="380" y1="132" x2="380" y2="154"/>
  <polygon class="edge" points="376,150 380,158 384,150" fill="#59636e"/>

  <rect class="sbox" x="280" y="160" width="200" height="44"/>
  <text class="ta" x="380" y="187">Scheduler</text>

  <line class="edge" x1="320" y1="206" x2="170" y2="244"/>
  <polygon class="edge" points="168,240 160,246 170,248" fill="#59636e"/>
  <line class="edge" x1="380" y1="206" x2="380" y2="244"/>
  <polygon class="edge" points="376,240 380,248 384,240" fill="#59636e"/>
  <line class="edge" x1="440" y1="206" x2="590" y2="244"/>
  <polygon class="edge" points="588,248 600,246 592,240" fill="#59636e"/>

  <rect class="box" x="90"  y="252" width="160" height="40"/>
  <text class="t" x="170" y="277">Prefill work</text>

  <rect class="box" x="300" y="252" width="160" height="40"/>
  <text class="t" x="380" y="277">Decode work</text>

  <rect class="cap" x="520" y="252" width="180" height="40"/>
  <text class="t" x="610" y="277" style="font-size:12px">Capacity / KV awareness</text>

  <line class="edge" x1="170" y1="294" x2="170" y2="324"/>
  <polygon class="edge" points="166,320 170,328 174,320" fill="#59636e"/>
  <line class="edge" x1="380" y1="294" x2="380" y2="324"/>
  <polygon class="edge" points="376,320 380,328 384,320" fill="#59636e"/>

  <rect class="gbox" x="220" y="330" width="320" height="50"/>
  <text class="t" x="380" y="360">GPU</text>

  <!-- side inputs -->
  <rect class="cap" x="40"  y="160" width="120" height="36"/>
  <text class="t" x="100" y="183" style="font-size:11px">memory capacity</text>
  <line class="edge" x1="160" y1="178" x2="278" y2="182" stroke-dasharray="4 3"/>

  <rect class="cap" x="600" y="160" width="120" height="36"/>
  <text class="t" x="660" y="183" style="font-size:11px">batch / token budget</text>
  <line class="edge" x1="600" y1="182" x2="482" y2="182" stroke-dasharray="4 3"/>

  <text class="lbl" x="380" y="420">policy is engine-specific — no single universal scheduler</text>
</svg>