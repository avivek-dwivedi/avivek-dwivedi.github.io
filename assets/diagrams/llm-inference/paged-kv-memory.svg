<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="pkTitle pkDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="pkTitle">Paged / block-based KV memory</title>
  <desc id="pkDesc">Left: conceptual contiguous allocation per request reserves unused capacity. Right: block or page style allocation where physical blocks are shared across requests and logical sequences reference blocks non-contiguously. Conceptual illustration, not byte-for-byte runtime internals.</desc>

  <style>
    .frame { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 6; ry: 6; }
    .used { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1; }
    .res  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 4 3; }
    .blk  { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 3; ry: 3; }
    .ba { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1.4; }
    .bb { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.4; }
    .bc { fill: #dafbe1; stroke: #2da44e; stroke-width: 1.4; }
    .t { font-size: 12px; fill: #1f2328; text-anchor: middle; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.06em; }
    .head { font-size: 14px; fill: #1f2328; text-anchor: middle; font-weight: 700; }
    .edge { stroke: #59636e; stroke-width: 1.3; fill: none; }
    .arrow { fill: #59636e; }
  </style>

  <text class="head" x="190" y="30">Contiguous allocation</text>
  <text class="head" x="570" y="30">Block / page style</text>
  <line class="edge" x1="380" y1="10" x2="380" y2="440"/>

  <!-- Left -->
  <text class="lbl" x="190" y="58">Request A</text>
  <g>
    <rect class="used" x="40" y="70" width="50" height="30"/>
    <rect class="used" x="95" y="70" width="50" height="30"/>
    <rect class="used" x="150" y="70" width="50" height="30"/>
    <rect class="res"  x="205" y="70" width="50" height="30"/>
    <rect class="res"  x="260" y="70" width="50" height="30"/>
    <text class="t" x="65" y="89" style="font-size:10px">used</text>
    <text class="t" x="285" y="89" style="font-size:10px">reserved</text>
  </g>

  <text class="lbl" x="190" y="125">Request B</text>
  <g>
    <rect class="used" x="40" y="137" width="50" height="30"/>
    <rect class="res"  x="95" y="137" width="50" height="30"/>
    <rect class="res"  x="150" y="137" width="50" height="30"/>
    <rect class="res"  x="205" y="137" width="50" height="30"/>
    <text class="t" x="65" y="156" style="font-size:10px">used</text>
  </g>

  <text class="lbl" x="190" y="192">Request C</text>
  <g>
    <rect class="used" x="40" y="204" width="50" height="30"/>
    <rect class="used" x="95" y="204" width="50" height="30"/>
    <rect class="used" x="150" y="204" width="50" height="30"/>
    <rect class="used" x="205" y="204" width="50" height="30"/>
    <rect class="used" x="260" y="204" width="50" height="30"/>
    <text class="t" x="65" y="223" style="font-size:10px">used</text>
  </g>
  <text class="lbl" x="190" y="270">reserved capacity wasted</text>
  <text class="lbl" x="190" y="288">fragmentation · over-allocation</text>

  <!-- Right: physical blocks -->
  <text class="lbl" x="570" y="58">Physical blocks</text>
  <g>
    <rect class="ba" x="430" y="70" width="48" height="30"/><text class="t" x="454" y="89" style="font-size:10px">B1</text>
    <rect class="bb" x="482" y="70" width="48" height="30"/><text class="t" x="506" y="89" style="font-size:10px">B2</text>
    <rect class="bc" x="534" y="70" width="48" height="30"/><text class="t" x="558" y="89" style="font-size:10px">B3</text>
    <rect class="ba" x="586" y="70" width="48" height="30"/><text class="t" x="610" y="89" style="font-size:10px">B4</text>
    <rect class="bb" x="638" y="70" width="48" height="30"/><text class="t" x="662" y="89" style="font-size:10px">B5</text>
    <rect class="bc" x="430" y="104" width="48" height="30"/><text class="t" x="454" y="123" style="font-size:10px">B6</text>
    <rect class="ba" x="482" y="104" width="48" height="30"/><text class="t" x="506" y="123" style="font-size:10px">B7</text>
    <rect class="bb" x="534" y="104" width="48" height="30"/><text class="t" x="558" y="123" style="font-size:10px">B8</text>
  </g>

  <!-- Logical sequences -->
  <text class="lbl" x="570" y="165">Logical Request A</text>
  <text class="t" x="570" y="186">B2 → B7 → B4</text>

  <text class="lbl" x="570" y="215">Logical Request B</text>
  <text class="t" x="570" y="236">B1 → B6</text>

  <text class="lbl" x="570" y="265">Logical Request C</text>
  <text class="t" x="570" y="286">B3 → B5 → B8</text>

  <text class="lbl" x="570" y="330">non-contiguous references</text>
  <text class="lbl" x="570" y="348">capacity assigned as needed</text>
  <text class="lbl" x="570" y="372">Conceptual illustration — not exact runtime internals</text>
</svg>