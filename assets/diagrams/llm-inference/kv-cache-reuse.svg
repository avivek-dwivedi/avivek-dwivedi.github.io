<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="kvTitle kvDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="kvTitle">Why KV cache exists</title>
  <desc id="kvDesc">Left side shows without reuse: each new token requires recomputing attention state for the entire prompt plus all generated tokens. Right side shows with KV cache: historical key/value tensors are stored and reused, and only the new token's representation is computed for the next decode step.</desc>

  <style>
    .box { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 4; ry: 4; }
    .recomp { fill: #ffebe9; stroke: #ff8182; stroke-width: 1; rx: 4; ry: 4; }
    .kv { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1; rx: 4; ry: 4; }
    .new { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; rx: 4; ry: 4; }
    .t { font-size: 12px; fill: #1f2328; text-anchor: middle; }
    .head { font-size: 13px; fill: #1f2328; text-anchor: middle; font-weight: 700; letter-spacing: 0.04em; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.06em; }
    .edge { stroke: #59636e; stroke-width: 1.2; fill: none; }
  </style>

  <text class="head" x="190" y="30">Without reuse</text>
  <text class="head" x="570" y="30">With KV cache</text>

  <line class="edge" x1="380" y1="10" x2="380" y2="400"/>

  <!-- Left: recompute stack -->
  <g>
    <rect class="box" x="40" y="55" width="300" height="28"/>
    <text class="t" x="190" y="74">Prompt + token 1 → recompute</text>
    <line class="edge" x1="190" y1="85" x2="190" y2="100"/>
    <polygon class="edge" points="186,96 190,104 194,96" fill="#59636e"/>

    <rect class="box" x="40" y="110" width="300" height="28"/>
    <text class="t" x="190" y="129">Prompt + token 1 + token 2 → recompute</text>
    <line class="edge" x1="190" y1="140" x2="190" y2="155"/>
    <polygon class="edge" points="186,151 190,159 194,151" fill="#59636e"/>

    <rect class="box" x="40" y="165" width="300" height="28"/>
    <text class="t" x="190" y="184">Prompt + tokens 1..3 → recompute</text>
    <line class="edge" x1="190" y1="195" x2="190" y2="210"/>
    <polygon class="edge" points="186,206 190,214 194,206" fill="#59636e"/>

    <rect class="recomp" x="40" y="220" width="300" height="40"/>
    <text class="t" x="190" y="245">next token</text>
    <text class="lbl" x="190" y="285">attention state recomputed each step</text>
    <text class="lbl" x="190" y="303">cost grows with sequence length</text>
  </g>

  <!-- Right: KV cache -->
  <g>
    <rect class="kv" x="430" y="55" width="280" height="40"/>
    <text class="t" x="570" y="80">Historical K / V stored</text>
    <line class="edge" x1="570" y1="97" x2="570" y2="118"/>
    <polygon class="edge" points="566,114 570,122 574,114" fill="#59636e"/>

    <rect class="new" x="490" y="128" width="160" height="34"/>
    <text class="t" x="570" y="150">new token</text>
    <line class="edge" x1="570" y1="164" x2="570" y2="185"/>
    <polygon class="edge" points="566,181 570,189 574,181" fill="#59636e"/>

    <rect class="box" x="430" y="195" width="280" height="40"/>
    <text class="t" x="570" y="220">next attention computation</text>
    <line class="edge" x1="570" y1="237" x2="570" y2="258"/>
    <polygon class="edge" points="566,254 570,262 574,254" fill="#59636e"/>

    <rect class="box" x="430" y="268" width="280" height="34"/>
    <text class="t" x="570" y="290">next decode step</text>

    <text class="lbl" x="570" y="330">historical attention state reused</text>
    <text class="lbl" x="570" y="348">only new token's K/V computed</text>
    <text class="lbl" x="570" y="376">saves repeated compute · consumes memory</text>
  </g>
</svg>