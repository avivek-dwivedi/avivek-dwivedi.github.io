<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-labelledby="epTitle epDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="epTitle">Evaluation pipeline before training</title>
  <desc id="epDesc">A pipeline showing the evaluation process before any training: task specification, error taxonomy, baseline selection, dataset construction with train/validation/test splits, baseline evaluation, error analysis, and adaptation decision. The decision point branches into: do not fine-tune, retrieval, SFT, or specialist model.</desc>

  <style>
    .box { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 6; ry: 6; }
    .data { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1; rx: 5; ry: 5; }
    .eval { fill: #dafbe1; stroke: #2da44e; stroke-width: 1; rx: 5; ry: 5; }
    .decision { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; rx: 6; ry: 6; }
    .branch { fill: #f6f8fa; stroke: #6e7781; stroke-width: 1; rx: 4; ry: 4; }
    .t { font-size: 13px; fill: #1f2328; text-anchor: middle; font-weight: 600; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.04em; }
    .edge { stroke: #59636e; stroke-width: 1.2; fill: none; }
    .arrow { fill: #59636e; }
  </style>

  <rect class="box" x="200" y="20" width="200" height="36"/><text class="t" x="300" y="43">Task Specification</text>
  <line class="edge" x1="300" y1="56" x2="300" y2="74"/>
  <polygon class="arrow" points="296,70 300,78 304,70"/>

  <rect class="box" x="200" y="80" width="200" height="36"/><text class="t" x="300" y="103">Error Taxonomy</text>
  <line class="edge" x1="300" y1="116" x2="300" y2="134"/>
  <polygon class="arrow" points="296,130 300,138 304,130"/>

  <rect class="data" x="160" y="140" width="280" height="36"/><text class="t" x="300" y="163">Dataset Construction</text>
  <text class="lbl" x="300" y="155" style="display:none"></text>
  <line class="edge" x1="300" y1="176" x2="300" y2="194"/>
  <polygon class="arrow" points="296,190 300,198 304,190"/>

  <!-- Data splits -->
  <rect class="data" x="60" y="200" width="140" height="30"/><text class="t" x="130" y="220" style="font-size:11px">Train (70%)</text>
  <rect class="data" x="230" y="200" width="140" height="30"/><text class="t" x="300" y="220" style="font-size:11px">Validation (15%)</text>
  <rect class="data" x="400" y="200" width="140" height="30"/><text class="t" x="470" y="220" style="font-size:11px">Test (15%)</text>
  <line class="edge" x1="300" y1="230" x2="300" y2="248"/>
  <polygon class="arrow" points="296,244 300,252 304,244"/>

  <rect class="eval" x="180" y="254" width="240" height="36"/><text class="t" x="300" y="277">Baseline Evaluation</text>
  <line class="edge" x1="300" y1="290" x2="300" y2="308"/>
  <polygon class="arrow" points="296,304 300,312 304,304"/>

  <rect class="eval" x="180" y="314" width="240" height="36"/><text class="t" x="300" y="337">Error Analysis</text>
  <line class="edge" x1="300" y1="350" x2="300" y2="368"/>
  <polygon class="arrow" points="296,364 300,372 304,364"/>

  <rect class="decision" x="170" y="374" width="260" height="40"/>
  <text class="t" x="300" y="399">Adaptation Decision</text>

  <!-- Branches -->
  <line class="edge" x1="200" y1="414" x2="100" y2="442"/>
  <line class="edge" x1="270" y1="414" x2="240" y2="442"/>
  <line class="edge" x1="330" y1="414" x2="360" y2="442"/>
  <line class="edge" x1="400" y1="414" x2="500" y2="442"/>
  <polygon class="arrow" points="96,438 100,446 104,438"/>
  <polygon class="arrow" points="236,438 240,446 244,438"/>
  <polygon class="arrow" points="356,438 360,446 364,438"/>
  <polygon class="arrow" points="496,438 500,446 504,438"/>

  <rect class="branch" x="40" y="448" width="120" height="28"/><text class="t" x="100" y="467" style="font-size:11px">Do not fine-tune</text>
  <rect class="branch" x="180" y="448" width="120" height="28"/><text class="t" x="240" y="467" style="font-size:11px">Retrieval</text>
  <rect class="branch" x="300" y="448" width="120" height="28"/><text class="t" x="360" y="467" style="font-size:11px">SFT / PEFT</text>
  <rect class="branch" x="440" y="448" width="120" height="28"/><text class="t" x="500" y="467" style="font-size:11px">Specialist</text>

  <text class="lbl" x="300" y="505">The decision is evidence-based — not a default to fine-tuning</text>
</svg>