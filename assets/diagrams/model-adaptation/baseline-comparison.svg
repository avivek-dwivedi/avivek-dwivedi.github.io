<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="baTitle baDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="baTitle">Baseline comparison architecture</title>
  <desc id="baDesc">Five baselines compared against the same evaluation set: A (frozen base model, basic prompt), B (frozen model, optimized prompt), C (frozen model, structured output), D (frozen model + retrieval), E (alternative model). Each baseline produces predictions that are scored on the same held-out test set.</desc>

  <style>
    .box { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 5; ry: 5; }
    .baseline { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1; rx: 5; ry: 5; }
    .eval { fill: #dafbe1; stroke: #2da44e; stroke-width: 1.5; rx: 6; ry: 6; }
    .t { font-size: 12px; fill: #1f2328; text-anchor: middle; font-weight: 600; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.04em; }
    .edge { stroke: #59636e; stroke-width: 1; fill: none; }
    .arrow { fill: #59636e; }
    .small { font-size: 10px; fill: #59636e; text-anchor: middle; }
  </style>

  <!-- Evaluation set (shared) -->
  <rect class="eval" x="220" y="20" width="200" height="36"/><text class="t" x="320" y="43">Held-out Test Set</text>

  <!-- Baselines -->
  <rect class="baseline" x="20" y="90" width="110" height="40"/><text class="t" x="75" y="108">Baseline A</text><text class="small" x="75" y="122">Basic prompt</text>
  <rect class="baseline" x="145" y="90" width="110" height="40"/><text class="t" x="200" y="108">Baseline B</text><text class="small" x="200" y="122">Optimized prompt</text>
  <rect class="baseline" x="270" y="90" width="110" height="40"/><text class="t" x="325" y="108">Baseline C</text><text class="small" x="325" y="122">Structured output</text>
  <rect class="baseline" x="395" y="90" width="110" height="40"/><text class="t" x="450" y="108">Baseline D</text><text class="small" x="450" y="122">+ Retrieval</text>
  <rect class="baseline" x="520" y="90" width="110" height="40"/><text class="t" x="575" y="108">Baseline E</text><text class="small" x="575" y="122">Alt model</text>

  <!-- Arrows from test set to baselines -->
  <line class="edge" x1="320" y1="56" x2="75" y2="90" style="stroke-dasharray:3,2"/>
  <line class="edge" x1="320" y1="56" x2="200" y2="90" style="stroke-dasharray:3,2"/>
  <line class="edge" x1="320" y1="56" x2="325" y2="90" style="stroke-dasharray:3,2"/>
  <line class="edge" x1="320" y1="56" x2="450" y2="90" style="stroke-dasharray:3,2"/>
  <line class="edge" x1="320" y1="56" x2="575" y2="90" style="stroke-dasharray:3,2"/>

  <!-- Predictions -->
  <rect class="box" x="20" y="160" width="110" height="30"/><text class="small" x="75" y="180">predictions A</text>
  <rect class="box" x="145" y="160" width="110" height="30"/><text class="small" x="200" y="180">predictions B</text>
  <rect class="box" x="270" y="160" width="110" height="30"/><text class="small" x="325" y="180">predictions C</text>
  <rect class="box" x="395" y="160" width="110" height="30"/><text class="small" x="450" y="180">predictions D</text>
  <rect class="box" x="520" y="160" width="110" height="30"/><text class="small" x="575" y="180">predictions E</text>

  <line class="edge" x1="75" y1="130" x2="75" y2="160"/>
  <line class="edge" x1="200" y1="130" x2="200" y2="160"/>
  <line class="edge" x1="325" y1="130" x2="325" y2="160"/>
  <line class="edge" x1="450" y1="130" x2="450" y2="160"/>
  <line class="edge" x1="575" y1="130" x2="575" y2="160"/>
  <polygon class="arrow" points="71,156 75,164 79,156"/>
  <polygon class="arrow" points="196,156 200,164 204,156"/>
  <polygon class="arrow" points="321,156 325,164 329,156"/>
  <polygon class="arrow" points="446,156 450,164 454,156"/>
  <polygon class="arrow" points="571,156 575,164 579,156"/>

  <!-- Scoring -->
  <rect class="eval" x="200" y="220" width="240" height="36"/><text class="t" x="320" y="243">Scoring &amp; Comparison</text>
  <line class="edge" x1="75" y1="190" x2="240" y2="220" style="stroke-dasharray:3,2"/>
  <line class="edge" x1="200" y1="190" x2="280" y2="220" style="stroke-dasharray:3,2"/>
  <line class="edge" x1="325" y1="190" x2="320" y2="220" style="stroke-dasharray:3,2"/>
  <line class="edge" x1="450" y1="190" x2="360" y2="220" style="stroke-dasharray:3,2"/>
  <line class="edge" x1="575" y1="190" x2="400" y2="220" style="stroke-dasharray:3,2"/>

  <line class="edge" x1="320" y1="256" x2="320" y2="274"/>
  <polygon class="arrow" points="316,270 320,278 324,270"/>

  <!-- Error analysis -->
  <rect class="box" x="160" y="280" width="320" height="36"/><text class="t" x="320" y="303">Error Analysis &amp; Failure Categorization</text>
  <line class="edge" x1="320" y1="316" x2="320" y2="334"/>
  <polygon class="arrow" points="316,330 320,338 324,330"/>

  <!-- Decision -->
  <rect class="box" x="200" y="340" width="240" height="40" style="fill:#fff8c5; stroke:#d4a72c; stroke-width:1.5; rx:6; ry:6"/>
  <text class="t" x="320" y="365">Adaptation Decision</text>

  <text class="lbl" x="320" y="400">All baselines evaluated on the same held-out test set</text>
  <text class="lbl" x="320" y="415">Same metrics, same inputs, same scoring — controlled comparison</text>
</svg>