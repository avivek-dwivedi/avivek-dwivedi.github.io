<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="rpTitle rpDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="rpTitle">Redaction pipeline before telemetry export</title>
  <desc id="rpDesc">Raw telemetry from the application passes through a policy and redaction stage that removes secrets, masks PII, truncates large payloads, and applies allow/deny field rules. The filtered, bounded payload is then exported to the Collector and backend. Sensitive data should be filtered before leaving the workload boundary.</desc>

  <style>
    .box { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 6; ry: 6; }
    .raw { fill: #ffebe9; stroke: #ff8182; stroke-width: 1; rx: 6; ry: 6; }
    .policy { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; rx: 6; ry: 6; }
    .clean { fill: #dafbe1; stroke: #2da44e; stroke-width: 1; rx: 6; ry: 6; }
    .backend { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1; rx: 6; ry: 6; }
    .t { font-size: 14px; fill: #1f2328; text-anchor: middle; font-weight: 600; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.04em; }
    .small { font-size: 11px; fill: #59636e; text-anchor: middle; }
    .edge { stroke: #59636e; stroke-width: 1.3; fill: none; }
    .arrow { fill: #59636e; }
    .rule { font-size: 11px; fill: #1f2328; text-anchor: start; }
  </style>

  <rect class="raw" x="180" y="20" width="200" height="40"/><text class="t" x="280" y="46">Raw Telemetry</text>
  <line class="edge" x1="280" y1="60" x2="280" y2="82"/>
  <polygon class="arrow" points="276,78 280,86 284,78"/>

  <rect class="policy" x="100" y="88" width="360" height="120"/>
  <text class="t" x="280" y="112">Policy / Redaction</text>
  <text class="rule" x="130" y="135">✕  remove secrets (API keys, tokens)</text>
  <text class="rule" x="130" y="155">✕  mask PII (emails, names, account IDs)</text>
  <text class="rule" x="130" y="175">✕  truncate large payloads</text>
  <text class="rule" x="130" y="195">✓  allow / deny field rules</text>

  <line class="edge" x1="280" y1="208" x2="280" y2="230"/>
  <polygon class="arrow" points="276,226 280,234 284,226"/>

  <rect class="clean" x="160" y="236" width="240" height="40"/><text class="t" x="280" y="262">Bounded Payload</text>
  <line class="edge" x1="280" y1="276" x2="280" y2="298"/>
  <polygon class="arrow" points="276,294 280,302 284,294"/>

  <rect class="box" x="180" y="304" width="200" height="40"/><text class="t" x="280" y="330">Exporter</text>
  <line class="edge" x1="280" y1="344" x2="280" y2="366"/>
  <polygon class="arrow" points="276,362 280,370 284,362"/>

  <rect class="backend" x="160" y="372" width="240" height="40"/><text class="t" x="280" y="398">Collector / Backend</text>

  <text class="lbl" x="280" y="440">Filter sensitive data before it leaves the workload boundary</text>
  <text class="lbl" x="280" y="458">Do not rely on "we'll hide it later in the dashboard"</text>
</svg>