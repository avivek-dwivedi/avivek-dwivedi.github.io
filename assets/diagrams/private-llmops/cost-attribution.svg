<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="caTitle caDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="caTitle">Cost attribution across a multi-agent workflow</title>
  <desc id="caDesc">Workflow total cost broken down by component: Planner Agent, Research Agent (with retrieval and tool), Validation Agent, and Final Generation. Relative contribution percentages are conceptual placeholders, not measured production values. Cost is aggregated per trace, per agent, per model, per workflow, and per tenant.</desc>

  <style>
    .total { fill: #dafbe1; stroke: #2da44e; stroke-width: 1.5; rx: 6; ry: 6; }
    .agent { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1; rx: 5; ry: 5; }
    .tool { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; rx: 4; ry: 4; }
    .ret { fill: #f6f8fa; stroke: #6e7781; stroke-width: 1; rx: 4; ry: 4; }
    .t { font-size: 13px; fill: #1f2328; text-anchor: middle; font-weight: 600; }
    .small { font-size: 11px; fill: #59636e; text-anchor: middle; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.04em; }
    .edge { stroke: #59636e; stroke-width: 1; fill: none; }
    .arrow { fill: #59636e; }
    .pct { font-size: 11px; fill: #8b5cf6; text-anchor: end; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .bar { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 0.5; }
    .note { font-size: 10px; fill: #6e7781; text-anchor: middle; font-style: italic; }
  </style>

  <rect class="total" x="80" y="20" width="400" height="36"/><text class="t" x="280" y="43">Workflow Total</text>

  <line class="edge" x1="280" y1="56" x2="280" y2="74"/>
  <polygon class="arrow" points="276,70 280,78 284,70"/>

  <!-- Planner -->
  <rect class="agent" x="100" y="80" width="360" height="32"/><text class="t" x="120" y="101" style="text-anchor:start; font-size:12px">Planner Agent</text>
  <text class="pct" x="450" y="101">~10%</text>

  <!-- Research -->
  <rect class="agent" x="100" y="122" width="360" height="32"/><text class="t" x="120" y="143" style="text-anchor:start; font-size:12px">Research Agent</text>
  <text class="pct" x="450" y="143">~45%</text>
  <rect class="ret" x="120" y="162" width="160" height="24"/><text class="small" x="200" y="179">retrieval</text>
  <rect class="tool" x="300" y="162" width="140" height="24"/><text class="small" x="370" y="179">tool execution</text>

  <!-- Validation -->
  <rect class="agent" x="100" y="198" width="360" height="32"/><text class="t" x="120" y="219" style="text-anchor:start; font-size:12px">Validation Agent</text>
  <text class="pct" x="450" y="219">~25%</text>

  <!-- Final Generation -->
  <rect class="agent" x="100" y="240" width="360" height="32"/><text class="t" x="120" y="261" style="text-anchor:start; font-size:12px">Final Generation</text>
  <text class="pct" x="450" y="261">~20%</text>

  <!-- Aggregation dimensions -->
  <text class="t" x="280" y="310" style="font-size:12px">Aggregate by:</text>
  <rect class="bar" x="60" y="325" width="90" height="26" style="rx:4; ry:4"/><text class="small" x="105" y="343">cost / trace</text>
  <rect class="bar" x="160" y="325" width="90" height="26" style="rx:4; ry:4"/><text class="small" x="205" y="343">cost / agent</text>
  <rect class="bar" x="260" y="325" width="90" height="26" style="rx:4; ry:4"/><text class="small" x="305" y="343">cost / model</text>
  <rect class="bar" x="360" y="325" width="90" height="26" style="rx:4; ry:4"/><text class="small" x="405" y="343">cost / session</text>
  <rect class="bar" x="160" y="360" width="90" height="26" style="rx:4; ry:4"/><text class="small" x="205" y="378">cost / workflow</text>
  <rect class="bar" x="260" y="360" width="90" height="26" style="rx:4; ry:4"/><text class="small" x="305" y="378">cost / tenant</text>

  <text class="note" x="280" y="420">Percentages are conceptual placeholders — not measured production values</text>
  <text class="lbl" x="280" y="440">Capture: provider · model · input_tokens · output_tokens · cached_tokens</text>
  <text class="lbl" x="280" y="458">Do not hardcode provider prices unless dated and researched</text>
</svg>