<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" role="img" aria-labelledby="atdTitle atdDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="atdTitle">Agent trace detail — LLM, retrieval, and tool spans</title>
  <desc id="atdDesc">One agent span containing four child spans: a generation (LLM call), a retrieval span, a tool span, and a second generation. Each operation is a separate span with its own duration and attributes, distinguishable from the surrounding LLM generation.</desc>

  <style>
    .agent { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1.5; rx: 6; ry: 6; }
    .gen { fill: #dafbe1; stroke: #2da44e; stroke-width: 1; rx: 4; ry: 4; }
    .tool { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; rx: 4; ry: 4; }
    .ret { fill: #f6f8fa; stroke: #6e7781; stroke-width: 1; rx: 4; ry: 4; }
    .t { font-size: 13px; fill: #1f2328; text-anchor: start; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.04em; }
    .edge { stroke: #59636e; stroke-width: 1; fill: none; }
    .arrow { fill: #59636e; }
    .dur { font-size: 10px; fill: #6e7781; text-anchor: end; font-family: ui-monospace, Menlo, Consolas, monospace; }
  </style>

  <rect class="agent" x="40" y="20" width="480" height="380"/>
  <text class="t" x="60" y="44" style="font-weight:700; font-size:14px">Agent: research_agent</text>

  <!-- generation 1 -->
  <rect class="gen" x="80" y="60" width="400" height="50"/>
  <text class="t" x="100" y="82">generation — LLM call</text>
  <text class="t" x="100" y="100" style="font-size:11px; fill:#59636e">gen_ai.operation.name=chat · gen_ai.request.model=...</text>
  <text class="dur" x="470" y="82">3.8s</text>

  <!-- retrieval -->
  <rect class="ret" x="80" y="130" width="400" height="80"/>
  <text class="t" x="100" y="152">retrieval</text>
  <text class="t" x="100" y="170" style="font-size:11px; fill:#59636e">query transform → vector search → rerank</text>
  <text class="t" x="100" y="188" style="font-size:11px; fill:#59636e">top-k · scores · retriever version</text>
  <text class="dur" x="470" y="152">0.8s</text>

  <!-- tool -->
  <rect class="tool" x="80" y="230" width="400" height="80"/>
  <text class="t" x="100" y="252">tool: billing.lookup_order</text>
  <text class="t" x="100" y="270" style="font-size:11px; fill:#59636e">tool.name · tool.status · duration · retry count</text>
  <text class="t" x="100" y="288" style="font-size:11px; fill:#59636e">error category · dependency</text>
  <text class="dur" x="470" y="252">5.0s</text>

  <!-- generation 2 -->
  <rect class="gen" x="80" y="330" width="400" height="50"/>
  <text class="t" x="100" y="352">generation — LLM call (post-tool)</text>
  <text class="t" x="100" y="370" style="font-size:11px; fill:#59636e">input_tokens · output_tokens · usage metadata</text>
  <text class="dur" x="470" y="352">5.1s</text>

  <text class="lbl" x="280" y="430">Each operation is a separate span — distinguishable from the surrounding LLM generation</text>
  <text class="lbl" x="280" y="448">Tool arguments and retrieval content may be sensitive — capture with policy</text>
</svg>