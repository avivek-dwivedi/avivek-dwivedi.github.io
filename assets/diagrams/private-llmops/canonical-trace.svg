<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-labelledby="ctTitle ctDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ctTitle">Canonical multi-agent trace model</title>
  <desc id="ctDesc">A reference trace hierarchy: the workflow trace contains an orchestrator span, a planner agent with a generation child, a retrieval span with query transform, vector search, and rerank children, a billing agent with a generation and a tool child, and a final generation. This is a reference shape, not a universal requirement.</desc>

  <style>
    .trace { fill: #dafbe1; stroke: #2da44e; stroke-width: 1.5; rx: 6; ry: 6; }
    .agent { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1.2; rx: 5; ry: 5; }
    .gen { fill: #dafbe1; stroke: #2da44e; stroke-width: 1; rx: 4; ry: 4; }
    .tool { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; rx: 4; ry: 4; }
    .ret { fill: #f6f8fa; stroke: #6e7781; stroke-width: 1; rx: 4; ry: 4; }
    .t { font-size: 13px; fill: #1f2328; text-anchor: start; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.04em; }
    .edge { stroke: #59636e; stroke-width: 1; fill: none; }
    .bracket { stroke: #d0d7de; stroke-width: 1; fill: none; }
  </style>

  <!-- TRACE root -->
  <rect class="trace" x="30" y="20" width="500" height="480"/>
  <text class="t" x="50" y="44" style="font-weight:700; font-size:14px">TRACE: support_workflow</text>

  <!-- orchestrator -->
  <rect class="agent" x="60" y="60" width="200" height="32"/><text class="t" x="80" y="81">orchestrator</text>

  <!-- planner_agent -->
  <rect class="agent" x="60" y="110" width="200" height="32"/><text class="t" x="80" y="131">planner_agent</text>
  <line class="edge" x1="160" y1="142" x2="160" y2="158"/>
  <rect class="gen" x="90" y="160" width="200" height="28"/><text class="t" x="110" y="179">generation</text>

  <!-- retrieval -->
  <rect class="ret" x="60" y="210" width="200" height="32"/><text class="t" x="80" y="231">retrieval</text>
  <line class="edge" x1="160" y1="242" x2="120" y2="258"/>
  <line class="edge" x1="160" y1="242" x2="160" y2="258"/>
  <line class="edge" x1="160" y1="242" x2="200" y2="258"/>
  <rect class="ret" x="80" y="260" width="130" height="24"/><text class="t" x="95" y="277" style="font-size:11px">query transform</text>
  <rect class="ret" x="220" y="260" width="120" height="24"/><text class="t" x="235" y="277" style="font-size:11px">vector search</text>
  <rect class="rect" x="350" y="260" width="110" height="24" style="fill:#f6f8fa; stroke:#6e7781; stroke-width:1; rx:4; ry:4"/><text class="t" x="365" y="277" style="font-size:11px">rerank</text>

  <!-- billing_agent -->
  <rect class="agent" x="60" y="310" width="200" height="32"/><text class="t" x="80" y="331">billing_agent</text>
  <line class="edge" x1="160" y1="342" x2="120" y2="358"/>
  <line class="edge" x1="160" y1="342" x2="200" y2="358"/>
  <rect class="gen" x="80" y="360" width="160" height="28"/><text class="t" x="100" y="379">generation</text>
  <rect class="tool" x="260" y="360" width="200" height="28"/><text class="t" x="280" y="379">tool: lookup_order</text>

  <!-- final_generation -->
  <rect class="gen" x="60" y="410" width="240" height="32"/><text class="t" x="80" y="431">final_generation</text>

  <line class="bracket" x1="50" y1="55" x2="55" y2="55"/>
  <line class="bracket" x1="50" y1="55" x2="50" y2="445"/>
  <line class="bracket" x1="50" y1="445" x2="55" y2="445"/>

  <text class="lbl" x="280" y="525">Reference trace shape — not all multi-agent systems follow this hierarchy</text>
  <text class="lbl" x="280" y="543">Workflow · Agent · Generation · Retrieval · Tool · Handoff</text>
</svg>