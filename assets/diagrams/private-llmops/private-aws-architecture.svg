<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" aria-labelledby="paaTitle paaDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="paaTitle">Private LLMOps architecture on AWS</title>
  <desc id="paaDesc">Private AWS environment boundary. Agent applications make LLM, tool, and RAG calls. OpenTelemetry SDK instruments these calls. Telemetry flows to an OTel Collector which splits: infrastructure telemetry to CloudWatch, AI telemetry to self-hosted Langfuse. Langfuse persists to PostgreSQL, ClickHouse, Redis/Valkey, and S3/blob storage. Traces, evaluations, cost and latency data are stored.</desc>

  <style>
    .aws { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; rx: 8; ry: 8; }
    .app { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1; rx: 5; ry: 5; }
    .otel { fill: #f6f8fa; stroke: #6e7781; stroke-width: 1; rx: 5; ry: 5; }
    .collector { fill: #ffffff; stroke: #30363d; stroke-width: 1.5; rx: 6; ry: 6; }
    .langfuse { fill: #dafbe1; stroke: #2da44e; stroke-width: 1.5; rx: 6; ry: 6; }
    .store { fill: #f6f8fa; stroke: #6e7781; stroke-width: 1; rx: 4; ry: 4; }
    .cw { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; rx: 5; ry: 5; }
    .t { font-size: 13px; fill: #1f2328; text-anchor: middle; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.04em; }
    .edge { stroke: #59636e; stroke-width: 1.2; fill: none; }
    .arrow { fill: #59636e; }
    .small { font-size: 11px; fill: #59636e; text-anchor: middle; }
  </style>

  <!-- AWS boundary -->
  <rect class="aws" x="20" y="20" width="640" height="510" style="fill:none; stroke-dasharray: 8,4"/>
  <text class="t" x="340" y="42" style="font-weight:700">Private AWS Environment</text>

  <!-- Applications -->
  <rect class="app" x="60" y="60" width="200" height="40"/><text class="t" x="160" y="85">Agent Applications</text>
  <rect class="app" x="60" y="110" width="60" height="26"/><text class="small" x="90" y="128">LLM</text>
  <rect class="app" x="130" y="110" width="60" height="26"/><text class="small" x="160" y="128">Tools</text>
  <rect class="app" x="200" y="110" width="60" height="26"/><text class="small" x="230" y="128">RAG</text>

  <!-- OTel SDK -->
  <rect class="otel" x="60" y="155" width="200" height="34"/><text class="t" x="160" y="177" style="font-size:12px">OpenTelemetry SDK</text>
  <line class="edge" x1="160" y1="136" x2="160" y2="155"/>
  <polygon class="arrow" points="156,151 160,159 164,151"/>

  <!-- Collector -->
  <rect class="collector" x="60" y="210" width="200" height="40"/><text class="t" x="160" y="235">OTel Collector</text>
  <text class="small" x="160" y="245">batching · redaction · sampling</text>
  <line class="edge" x1="160" y1="189" x2="160" y2="210"/>
  <polygon class="arrow" points="156,206 160,214 164,206"/>

  <!-- Split: CloudWatch path -->
  <line class="edge" x1="260" y1="230" x2="480" y2="180" style="stroke-dasharray:4,3"/>
  <polygon class="arrow" points="476,176 484,180 478,186"/>
  <text class="lbl" x="370" y="200">infrastructure telemetry</text>
  <rect class="cw" x="460" y="155" width="170" height="50"/>
  <text class="t" x="545" y="178" style="font-size:12px">CloudWatch</text>
  <text class="small" x="545" y="195">infra monitoring</text>

  <!-- Split: Langfuse path -->
  <line class="edge" x1="260" y1="240" x2="480" y2="290"/>
  <polygon class="arrow" points="476,286 484,290 478,294"/>
  <text class="lbl" x="370" y="275">AI telemetry</text>

  <!-- Langfuse -->
  <rect class="langfuse" x="440" y="265" width="210" height="50"/>
  <text class="t" x="545" y="290" style="font-size:12px">Self-hosted Langfuse</text>
  <text class="small" x="545" y="307">Web + Worker</text>

  <!-- Storage -->
  <rect class="store" x="440" y="340" width="95" height="34"/><text class="t" x="487" y="362" style="font-size:11px">PostgreSQL</text>
  <rect class="store" x="440" y="384" width="95" height="34"/><text class="t" x="487" y="406" style="font-size:11px">ClickHouse</text>
  <rect class="store" x="545" y="340" width="105" height="34"/><text class="t" x="597" y="362" style="font-size:11px">Redis / Valkey</text>
  <rect class="store" x="545" y="384" width="105" height="34"/><text class="t" x="597" y="406" style="font-size:11px">S3 / Blob</text>

  <line class="edge" x1="545" y1="315" x2="487" y2="340"/>
  <line class="edge" x1="545" y1="315" x2="487" y2="384"/>
  <line class="edge" x1="545" y1="315" x2="597" y2="340"/>
  <line class="edge" x1="545" y1="315" x2="597" y2="384"/>

  <!-- Outputs -->
  <rect class="store" x="460" y="440" width="80" height="26"/><text class="small" x="500" y="458">Traces</text>
  <rect class="store" x="545" y="440" width="80" height="26"/><text class="small" x="585" y="458">Evals</text>
  <rect class="store" x="460" y="472" width="80" height="26"/><text class="small" x="500" y="490">Cost</text>
  <rect class="store" x="545" y="472" width="80" height="26"/><text class="small" x="585" y="490">Latency</text>

  <text class="lbl" x="160" y="490">CloudWatch and Langfuse answer different questions</text>
  <text class="lbl" x="160" y="510">OTel correlation bridges infra and AI observability layers</text>
</svg>