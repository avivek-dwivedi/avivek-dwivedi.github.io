<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 620" width="440" height="620" role="img" aria-labelledby="wlTitle wlDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="wlTitle">GPU worker lifecycle</title>
  <desc id="wlDesc">The lifecycle of a GPU inference worker: pod requested, scheduler finds a suitable node, GPU resource allocated, container starts, model artifact downloaded or mounted, weights load, CUDA and runtime initialization, memory structures initialize, optional warm-up, health and readiness check succeeds, and the worker receives traffic.</desc>

  <style>
    .box { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 6; ry: 6; }
    .accent { fill: #ddf4ff; stroke: #2f81f7; stroke-width: 1; rx: 6; ry: 6; }
    .ready { fill: #dafbe1; stroke: #2da44e; stroke-width: 1; rx: 6; ry: 6; }
    .t { font-size: 12px; fill: #1f2328; text-anchor: middle; }
    .ta { font-size: 12px; fill: #0a66c2; text-anchor: middle; font-weight: 600; }
    .tr { font-size: 12px; fill: #1a7f37; text-anchor: middle; font-weight: 600; }
    .edge { stroke: #59636e; stroke-width: 1.3; fill: none; }
  </style>

  <rect class="box" x="110" y="15" width="220" height="36"/><text class="t" x="220" y="38">Pod / worker requested</text>
  <line class="edge" x1="220" y1="51" x2="220" y2="66"/><polygon class="edge" points="216,62 220,70 224,62" fill="#59636e"/>

  <rect class="box" x="110" y="72" width="220" height="36"/><text class="t" x="220" y="95">Scheduler finds suitable node</text>
  <line class="edge" x1="220" y1="108" x2="220" y2="123"/><polygon class="edge" points="216,119 220,127 224,119" fill="#59636e"/>

  <rect class="accent" x="110" y="129" width="220" height="36"/><text class="ta" x="220" y="152">GPU resource allocated</text>
  <line class="edge" x1="220" y1="165" x2="220" y2="180"/><polygon class="edge" points="216,176 220,184 224,176" fill="#59636e"/>

  <rect class="box" x="110" y="186" width="220" height="36"/><text class="t" x="220" y="209">Container starts</text>
  <line class="edge" x1="220" y1="222" x2="220" y2="237"/><polygon class="edge" points="216,233 220,241 224,233" fill="#59636e"/>

  <rect class="accent" x="110" y="243" width="220" height="36"/><text class="ta" x="220" y="266">Model artifact downloaded / mounted</text>
  <line class="edge" x1="220" y1="279" x2="220" y2="294"/><polygon class="edge" points="216,290 220,298 224,290" fill="#59636e"/>

  <rect class="accent" x="110" y="300" width="220" height="36"/><text class="ta" x="220" y="323">Weights load into GPU memory</text>
  <line class="edge" x1="220" y1="336" x2="220" y2="351"/><polygon class="edge" points="216,347 220,355 224,347" fill="#59636e"/>

  <rect class="box" x="110" y="357" width="220" height="36"/><text class="t" x="220" y="380">CUDA / runtime initialization</text>
  <line class="edge" x1="220" y1="393" x2="220" y2="408"/><polygon class="edge" points="216,404 220,412 224,404" fill="#59636e"/>

  <rect class="box" x="110" y="414" width="220" height="36"/><text class="t" x="220" y="437">Memory structures initialize</text>
  <line class="edge" x1="220" y1="450" x2="220" y2="465"/><polygon class="edge" points="216,461 220,469 224,461" fill="#59636e"/>

  <rect class="box" x="110" y="471" width="220" height="36"/><text class="t" x="220" y="494">Optional warm-up</text>
  <line class="edge" x1="220" y1="507" x2="220" y2="522"/><polygon class="edge" points="216,518 220,526 224,518" fill="#59636e"/>

  <rect class="ready" x="110" y="528" width="220" height="36"/><text class="tr" x="220" y="551">Health / readiness succeeds</text>
  <line class="edge" x1="220" y1="564" x2="220" y2="579"/><polygon class="edge" points="216,575 220,583 224,575" fill="#59636e"/>

  <rect class="ready" x="110" y="585" width="220" height="30"/><text class="tr" x="220" y="605">Worker receives traffic</text>
</svg>