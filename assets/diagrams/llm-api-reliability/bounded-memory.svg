<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="bmTitle bmDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bmTitle">Bounded memory design</title>
  <desc id="bmDesc">Left: a bad design where a provider feeds into an unbounded memory buffer and a slow client causes the buffer to grow indefinitely. Right: a bounded design where a bounded queue feeds persistence and streaming, and backpressure propagates when downstream slows.</desc>

  <style>
    .box { fill: #ffffff; stroke: #30363d; stroke-width: 1; rx: 6; ry: 6; }
    .bad { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.5; rx: 6; ry: 6; }
    .good { fill: #dafbe1; stroke: #2da44e; stroke-width: 1.5; rx: 6; ry: 6; }
    .t { font-size: 12px; fill: #1f2328; text-anchor: middle; }
    .head { font-size: 14px; fill: #1f2328; text-anchor: middle; font-weight: 700; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.04em; }
    .edge { stroke: #59636e; stroke-width: 1.2; fill: none; }
    .back { stroke: #ff8182; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>

  <text class="head" x="190" y="25">Unbounded</text>
  <text class="head" x="570" y="25">Bounded</text>
  <line class="edge" x1="380" y1="10" x2="380" y2="360"/>

  <!-- Left bad -->
  <rect class="box" x="120" y="50" width="140" height="34"/><text class="t" x="190" y="72">Provider</text>
  <line class="edge" x1="190" y1="84" x2="190" y2="105"/><polygon class="edge" points="186,101 190,109 194,101" fill="#59636e"/>

  <rect class="bad" x="60" y="110" width="260" height="50"/>
  <text class="t" x="190" y="132">Unbounded memory buffer</text>
  <text class="lbl" x="190" y="150">grows indefinitely</text>
  <line class="edge" x1="190" y1="160" x2="190" y2="185"/><polygon class="edge" points="186,181 190,189 194,181" fill="#59636e"/>

  <rect class="box" x="110" y="190" width="160" height="34"/><text class="t" x="190" y="212">Slow client</text>
  <text class="lbl" x="190" y="250">buffer grows → memory exhaustion</text>
  <text class="lbl" x="190" y="270">no backpressure</text>

  <!-- Right good -->
  <rect class="box" x="500" y="50" width="140" height="34"/><text class="t" x="570" y="72">Provider</text>
  <line class="edge" x1="570" y1="84" x2="570" y2="105"/><polygon class="edge" points="566,101 570,109 574,101" fill="#59636e"/>

  <rect class="good" x="440" y="110" width="260" height="50"/>
  <text class="t" x="570" y="132">Bounded queue</text>
  <text class="lbl" x="570" y="150">maxsize enforced</text>

  <line class="edge" x1="530" y1="160" x2="470" y2="195"/><polygon class="edge" points="474,191 466,199 470,203" fill="#59636e"/>
  <line class="edge" x1="610" y1="160" x2="670" y2="195"/><polygon class="edge" points="666,191 674,199 670,203" fill="#59636e"/>

  <rect class="box" x="400" y="200" width="120" height="34"/><text class="t" x="460" y="222">Persist</text>
  <rect class="box" x="620" y="200" width="120" height="34"/><text class="t" x="680" y="222">Stream</text>

  <!-- Backpressure -->
  <path class="back" d="M440,132 C380,132 380,80 500,84"/>
  <text class="lbl" x="370" y="135" style="fill:#a53737">backpressure</text>

  <text class="lbl" x="570" y="280">when downstream slows: backpressure propagates</text>
  <text class="lbl" x="570" y="300">memory stays bounded</text>
</svg>