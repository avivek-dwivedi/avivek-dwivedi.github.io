<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="rjTitle rjDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="rjTitle">Retry synchronization vs jitter</title>
  <desc id="rjDesc">Left: without jitter, 100 failed requests all wait the same delay and retry simultaneously, creating synchronized spikes that keep the provider overloaded. Right: with full jitter, retries spread across a time range, reducing synchronized load.</desc>

  <style>
    .spike { fill: #ffebe9; stroke: #ff8182; stroke-width: 1; }
    .spread { fill: #dafbe1; stroke: #2da44e; stroke-width: 1; }
    .t { font-size: 11px; fill: #1f2328; text-anchor: middle; }
    .head { font-size: 14px; fill: #1f2328; text-anchor: middle; font-weight: 700; }
    .lbl { font-size: 11px; fill: #6e7781; text-anchor: middle; letter-spacing: 0.04em; }
    .axis { stroke: #59636e; stroke-width: 1; fill: none; }
  </style>

  <text class="head" x="190" y="25">Without jitter</text>
  <text class="head" x="570" y="25">With full jitter</text>
  <line class="axis" x1="380" y1="10" x2="380" y2="260"/>

  <!-- Left: synchronized spikes -->
  <line class="axis" x1="50" y1="230" x2="360" y2="230"/>
  <text class="t" x="205" y="250">time</text>
  <text class="lbl" x="70" y="250">retry 1</text>
  <text class="lbl" x="200" y="250">retry 2</text>
  <text class="lbl" x="330" y="250">retry 3</text>

  <rect class="spike" x="55" y="80" width="30" height="150"/>
  <text class="t" x="70" y="75">100</text>
  <rect class="spike" x="185" y="80" width="30" height="150"/>
  <text class="t" x="200" y="75">100</text>
  <rect class="spike" x="315" y="80" width="30" height="150"/>
  <text class="t" x="330" y="75">100</text>

  <text class="lbl" x="205" y="45">all retry at once → provider stays overloaded</text>

  <!-- Right: dispersed -->
  <line class="axis" x1="430" y1="230" x2="740" y2="230"/>
  <text class="t" x="585" y="250">time</text>

  <rect class="spread" x="440" y="180" width="14" height="50"/>
  <rect class="spread" x="460" y="160" width="14" height="70"/>
  <rect class="spread" x="480" y="190" width="14" height="40"/>
  <rect class="spread" x="500" y="150" width="14" height="80"/>
  <rect class="spread" x="520" y="175" width="14" height="55"/>
  <rect class="spread" x="540" y="195" width="14" height="35"/>
  <rect class="spread" x="560" y="165" width="14" height="65"/>
  <rect class="spread" x="580" y="185" width="14" height="45"/>
  <rect class="spread" x="600" y="155" width="14" height="75"/>
  <rect class="spread" x="620" y="190" width="14" height="40"/>
  <rect class="spread" x="640" y="170" width="14" height="60"/>
  <rect class="spread" x="660" y="195" width="14" height="35"/>
  <rect class="spread" x="680" y="175" width="14" height="55"/>
  <rect class="spread" x="700" y="160" width="14" height="70"/>

  <text class="lbl" x="585" y="45">retries dispersed across time range</text>
</svg>